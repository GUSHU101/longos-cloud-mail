version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /mail-worker
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mail-vue
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mail-relay
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]
