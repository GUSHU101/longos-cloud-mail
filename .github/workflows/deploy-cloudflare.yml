name: 🚀 Deploy cloud-mail to Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: "Worker 名称（通常保持 cloud-mail）"
        required: false
        default: "cloud-mail"
        type: string
      custom_domain:
        description: "网页/API 域名，例如 mail.example.com（不要带 https://；不能有冲突 DNS）"
        required: false
        type: string
      mail_domains:
        description: "收件域；一个填 example.com，多个用逗号分隔"
        required: true
        type: string
      admin_email:
        description: "Cloud Mail 管理员邮箱；首次由 ADMIN_PASSWORD 自动建号"
        required: true
        type: string
      longos_relay_url:
        description: "LONGOS 主站网关完整地址：https://shop.example.com/_longos/mail-relay"
        required: false
        type: string
      cloudflare_account_id:
        description: "Account ID（Token 仅能访问一个账户时留空自动识别）"
        required: false
        type: string
      d1_database_name:
        description: "D1 名称（通常留空，自动使用 Worker 名并创建/复用）"
        required: false
        type: string
      d1_database_id:
        description: "高级迁移：固定已有 D1 ID；首次部署必须留空"
        required: false
        type: string
      kv_namespace_id:
        description: "高级迁移：固定已有 KV ID；首次部署必须留空"
        required: false
        type: string
      r2_bucket_name:
        description: "R2 桶名；auto 自动命名并创建，清空则关闭附件存储"
        required: false
        default: "auto"
        type: string
      project_link:
        description: "界面项目链接（可选 HTTPS URL）"
        required: false
        type: string
      ai_model:
        description: "Workers AI 模型"
        required: false
        default: "@cf/meta/llama-3.1-8b-instruct-fast"
        type: string
      cors_origins:
        description: '跨域 Origin JSON 数组；同源保持 []'
        required: false
        default: "[]"
        type: string
      auto_configure_email_routing:
        description: "自动启用 Email Routing 并配置 Catch-all"
        required: false
        default: true
        type: boolean
      cloudflare_email:
        description: "启用 Cloudflare Email 出站兼容绑定（LONGOS 模式请关闭）"
        required: false
        default: false
        type: boolean
      analysis_cache:
        description: "启用邮件分析缓存"
        required: false
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: cloud-mail-production
  cancel-in-progress: false

jobs:
  deploy-cloud-mail:
    name: 🏗️ Validate, test and deploy
    # Public forks use their own repository and secrets. In this repository,
    # only its owner may deploy the reviewed default branch to production.
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production

    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}
      d1_database_id: ${{ steps.deploy.outputs.d1_database_id }}
      kv_namespace_id: ${{ steps.deploy.outputs.kv_namespace_id }}
      r2_bucket_name: ${{ steps.deploy.outputs.r2_bucket_name }}

    steps:
      # Only boolean presence flags enter this step. The credential values
      # remain unavailable until the final deployment step, after the
      # secret-free build and test suite has passed.
      - name: 🔐 检查 production Secrets / Check deployment credentials
        id: credential_preflight
        shell: bash
        env:
          CF_TOKEN_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          LONGOS_TOKEN_CONFIGURED: ${{ secrets.LONGOS_INTEGRATION_TOKEN != '' }}
          ADMIN_PASSWORD_CONFIGURED: ${{ secrets.ADMIN_PASSWORD != '' }}
          LONGOS_GATEWAY_CONFIGURED: ${{ inputs.longos_relay_url != '' }}
        run: |
          missing=()
          [[ "$CF_TOKEN_CONFIGURED" == "true" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          if [[ "$LONGOS_GATEWAY_CONFIGURED" == "true" && "$LONGOS_TOKEN_CONFIGURED" != "true" ]]; then
            missing+=("LONGOS_INTEGRATION_TOKEN")
          fi

          if (( ${#missing[@]} > 0 )); then
            missing_list="$(IFS=', '; echo "${missing[*]}")"
            echo "::error title=production Secrets 缺失::请先在 Settings → Environments → production 添加：${missing_list}"
            {
              echo "## 部署尚未开始：production Secrets 缺失"
              echo
              echo "当前缺少：\`${missing_list}\`"
              echo
              echo "1. 打开 **Settings → Environments → production → Environment secrets**。"
              echo "2. 添加上述 Secret；不要放到 Variables，也不要粘贴到 Run workflow 文本框。"
              echo "3. 从可信终端运行 \`node scripts/trigger-github-deployment.mjs\` 可隐藏录入并自动配置。"
              echo "4. 修复后使用原来的 Worker、D1、KV 和 R2 名称重跑，不要删除现有资源。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ "$ADMIN_PASSWORD_CONFIGURED" != "true" ]]; then
            echo "::notice title=ADMIN_PASSWORD 未配置::升级已有管理员时可留空；全新 D1 首次部署前必须添加。"
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: 🚚 检出代码仓库 / Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: ⚙ 设置 pnpm / Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0

      - name: ⚙ 设置 Node.js / Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            ./mail-worker/pnpm-lock.yaml
            ./mail-vue/pnpm-lock.yaml

      # Local deployment and GitHub Actions intentionally use the same
      # validated implementation so resource creation, secrets, migrations
      # and acceptance checks cannot drift apart.
      - name: 🧪 无密钥安装、审计、测试与构建 / Secret-free verification
        run: node scripts/verify-deployment.mjs

      - name: 🚀 一键验证并部署 / Validate and deploy
        id: deploy
        # Production credentials exist only for this step, after the protected
        # environment has approved the owner-triggered default-branch job.
        env:
          NAME: ${{ inputs.worker_name }}
          CUSTOM_DOMAIN: ${{ inputs.custom_domain }}
          DOMAIN: ${{ inputs.mail_domains }}
          ADMIN: ${{ inputs.admin_email }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}
          D1_DATABASE_NAME: ${{ inputs.d1_database_name || inputs.worker_name }}
          D1_DATABASE_ID: ${{ inputs.d1_database_id }}
          KV_NAMESPACE_ID: ${{ inputs.kv_namespace_id }}
          R2_BUCKET_NAME: ${{ inputs.r2_bucket_name }}
          PROJECT_LINK: ${{ inputs.project_link }}
          AI_MODEL: ${{ inputs.ai_model }}
          CLOUDFLARE_EMAIL: ${{ inputs.cloudflare_email && 'true' || 'false' }}
          ANALYSIS_CACHE: ${{ inputs.analysis_cache && 'true' || 'false' }}
          LONGOS_RELAY_URL: ${{ inputs.longos_relay_url }}
          LONGOS_INTEGRATION_TOKEN: ${{ inputs.longos_relay_url != '' && secrets.LONGOS_INTEGRATION_TOKEN || '' }}
          RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          CORS_ORIGINS: ${{ inputs.cors_origins }}
          AUTO_CONFIGURE_EMAIL_ROUTING: ${{ inputs.auto_configure_email_routing && 'true' || 'false' }}
        run: node scripts/deploy-cloudflare.mjs --from-env --skip-verification

      - name: 📋 部署结果摘要 / Deployment summary
        if: always()
        shell: bash
        env:
          CREDENTIAL_PREFLIGHT: ${{ steps.credential_preflight.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
          WORKER_STATE: ${{ steps.deploy.outputs.worker_state }}
          D1_DATABASE_ID: ${{ steps.deploy.outputs.d1_database_id }}
          D1_STATE: ${{ steps.deploy.outputs.d1_state }}
          KV_NAMESPACE_ID: ${{ steps.deploy.outputs.kv_namespace_id }}
          KV_STATE: ${{ steps.deploy.outputs.kv_state }}
          R2_BUCKET_NAME: ${{ steps.deploy.outputs.r2_bucket_name }}
          R2_STATE: ${{ steps.deploy.outputs.r2_state }}
        run: |
          {
            echo "## LONGOS Cloud Mail deployment"
            echo
            if [[ "$CREDENTIAL_PREFLIGHT" != "success" ]]; then
              echo "❌ 生产凭据预检未通过，Worker 与 Cloudflare 数据均未修改。"
              echo "- 在 **Settings → Environments → production** 补齐日志列出的 Environment Secrets 后重跑。"
            elif [[ "$DEPLOY_OUTCOME" == "success" ]]; then
              echo "✅ Worker、数据库初始化、临时密钥撤销、收信路由和发信 DNS 验收已通过。"
              [[ -n "$WORKER_URL" ]] && echo "- 地址：[$WORKER_URL]($WORKER_URL)"
              echo "- Worker：$WORKER_STATE"
              echo "- D1：$D1_STATE · \`$D1_DATABASE_ID\`"
              echo "- KV：$KV_STATE · \`$KV_NAMESPACE_ID\`"
              if [[ "$R2_STATE" == "disabled" ]]; then
                echo "- R2：未启用"
              else
                echo "- R2：$R2_STATE · \`$R2_BUCKET_NAME\`"
              fi
            else
              echo "❌ 部署或最终验收未通过。展开上方 **Validate and deploy**，从第一条 \`[失败]\` 开始处理；不要只看最后的退出码。"
              echo "- 修复权限、域名、网关或 DNS 后，用相同资源名称/ID 重跑；部署器会复用已有 D1、KV 和 R2。"
              echo "- 教程：[从零部署与网站关联](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/doc/QUICK_START.md)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
