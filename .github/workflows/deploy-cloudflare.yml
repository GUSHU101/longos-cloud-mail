name: 🚀 Deploy cloud-mail to Cloudflare Workers

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref containing the Cloud Mail version to deploy"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: cloud-mail-production
  cancel-in-progress: false

jobs:
  deploy-cloud-mail:
    name: 🏗️ Validate, test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NAME: ${{ secrets.NAME || vars.NAME || 'cloud-mail' }}
      CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN || vars.CUSTOM_DOMAIN }}
      DOMAIN: ${{ secrets.DOMAIN || vars.DOMAIN }}
      ADMIN: ${{ secrets.ADMIN || vars.ADMIN }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME || vars.D1_DATABASE_NAME || secrets.NAME || vars.NAME || 'cloud-mail' }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID || vars.KV_NAMESPACE_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
      PROJECT_LINK: ${{ secrets.PROJECT_LINK || vars.PROJECT_LINK }}
      AI_MODEL: ${{ secrets.AI_MODEL || vars.AI_MODEL || '@cf/meta/llama-3.1-8b-instruct-fast' }}
      CLOUDFLARE_EMAIL: ${{ secrets.CF_EMAIL || vars.CF_EMAIL || false }}
      ANALYSIS_CACHE: ${{ secrets.ANALYSIS_CACHE || vars.ANALYSIS_CACHE || false }}
      LONGOS_RELAY_URL: ${{ secrets.LONGOS_RELAY_URL || vars.LONGOS_RELAY_URL }}
      LONGOS_INTEGRATION_TOKEN: ${{ secrets.LONGOS_INTEGRATION_TOKEN }}
      RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS || vars.CORS_ORIGINS || '[]' }}

    outputs:
      worker_url: ${{ steps.deploy.outputs.worker_url }}

    steps:
      - name: 🚚 检出代码仓库 / Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: ⚙ 设置 pnpm / Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0

      - name: ⚙ 设置 Node.js / Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: |
            ./mail-worker/pnpm-lock.yaml
            ./mail-vue/pnpm-lock.yaml

      # Local deployment and GitHub Actions intentionally use the same
      # validated implementation so resource creation, secrets, migrations
      # and acceptance checks cannot drift apart.
      - name: 🚀 一键验证并部署 / Validate and deploy
        id: deploy
        run: node scripts/deploy-cloudflare.mjs --from-env
