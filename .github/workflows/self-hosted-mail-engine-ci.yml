name: Self-hosted mail engine CI

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "dependabot/**"
    paths:
      - "mail-relay/**"
      - "mail-worker/**"
      - "mail-vue/**"
      - "scripts/**"
      - ".cloud-mail.deploy.env.example"
      - ".github/workflows/self-hosted-mail-engine-ci.yml"
      - ".github/workflows/deploy-cloudflare.yml"
  pull_request:
    paths:
      - "mail-relay/**"
      - "mail-worker/**"
      - "mail-vue/**"
      - "scripts/**"
      - ".cloud-mail.deploy.env.example"
      - ".github/workflows/self-hosted-mail-engine-ci.yml"
      - ".github/workflows/deploy-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: self-hosted-mail-engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            mail-worker/pnpm-lock.yaml
            mail-vue/pnpm-lock.yaml
      - name: Install Worker dependencies
        working-directory: mail-worker
        run: pnpm install --frozen-lockfile
      - name: Install frontend dependencies
        working-directory: mail-vue
        run: pnpm install --frozen-lockfile
      - name: Audit Worker production dependencies
        working-directory: mail-worker
        run: pnpm audit --prod --audit-level moderate
      - name: Audit frontend production dependencies
        working-directory: mail-vue
        run: pnpm audit --prod --audit-level moderate
      - name: Test Worker mail engine
        working-directory: mail-worker
        run: pnpm run test:unit
      - name: Build frontend
        working-directory: mail-vue
        run: pnpm run build
      - name: Validate simplified deployment inputs
        env:
          CLOUDFLARE_API_TOKEN: validation-token
          DOMAIN: example.com,example.net
          ADMIN: admin@example.com
          LONGOS_RELAY_URL: https://shop.example.com/_longos/mail-relay
          LONGOS_INTEGRATION_TOKEN: longos_it_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: node scripts/deploy-cloudflare.mjs --from-env --validate-only
      - name: Bundle Worker
        working-directory: mail-worker
        run: pnpm exec wrangler deploy --dry-run --outdir /tmp/cloud-mail-worker
      - name: Validate rendered production template
        working-directory: mail-worker
        run: |
          cp wrangler-action.toml wrangler-action-ci.toml
          sed -i 's|${NAME}|cloud-mail-ci|g' wrangler-action-ci.toml
          sed -i 's|${CUSTOM_DOMAIN}|mail.example.com|g' wrangler-action-ci.toml
          sed -i 's|${D1_DATABASE_NAME}|cloud-mail-ci|g' wrangler-action-ci.toml
          sed -i 's|${D1_DATABASE_ID}|00000000-0000-0000-0000-000000000001|g' wrangler-action-ci.toml
          sed -i 's|${KV_NAMESPACE_ID}|00000000000000000000000000000001|g' wrangler-action-ci.toml
          sed -i 's|${R2_BUCKET_NAME}|cloud-mail-ci|g' wrangler-action-ci.toml
          sed -i 's|${DOMAIN}|["example.com"]|g' wrangler-action-ci.toml
          sed -i 's|${ADMIN}|admin@example.com|g' wrangler-action-ci.toml
          sed -i 's|${PROJECT_LINK}|https://example.com/project|g' wrangler-action-ci.toml
          sed -i 's|${AI_MODEL}|@cf/meta/llama-3.1-8b-instruct-fast|g' wrangler-action-ci.toml
          sed -i 's|${ANALYSIS_CACHE}|false|g' wrangler-action-ci.toml
          sed -i 's|${LONGOS_RELAY_URL}|https://admin.example.com/_longos/mail-relay|g' wrangler-action-ci.toml
          sed -i 's|${CORS_ORIGINS}|[]|g' wrangler-action-ci.toml
          if grep -q '\${' wrangler-action-ci.toml; then
            echo "Unresolved placeholder in rendered production configuration"
            exit 1
          fi
          pnpm exec wrangler deploy --dry-run --config wrangler-action-ci.toml --outdir /tmp/cloud-mail-production-template

  relay-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mail-relay/package-lock.json
      - name: Test relay security
        working-directory: mail-relay
        run: npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=moderate && npm test
      - name: Build relay image
        run: docker build --tag cloud-mail-relay:ci ./mail-relay
      - name: Smoke-test file-mounted relay secrets
        shell: bash
        run: |
          secret_dir="$(mktemp -d)"
          container="cloud-mail-relay-secret-ci"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            rm -rf "$secret_dir"
          }
          trap cleanup EXIT
          printf '%s' 'longos-longos-longos-longos-123456' > "$secret_dir/longos"
          printf '%s' 'cloud-mail-cloud-mail-cloud-123456' > "$secret_dir/cloud-mail"
          chmod 600 "$secret_dir/longos" "$secret_dir/cloud-mail"
          docker run --detach --name "$container" \
            --env MAIL_HOSTNAME=mailout.example.com \
            --env MAIL_PUBLIC_IPS=8.8.8.8 \
            --env MAIL_DOMAINS=example.com \
            --env ALLOWED_SENDER_DOMAINS=example.com \
            --env LONGOS_RELAY_SHARED_SECRET_FILE=/run/secrets/longos \
            --env CLOUD_MAIL_RELAY_SHARED_SECRET_FILE=/run/secrets/cloud-mail \
            --env IDEMPOTENCY_STORE_PATH=/var/lib/cloud-mail-relay/idempotency.jsonl \
            --mount "type=bind,src=$secret_dir/longos,dst=/run/secrets/longos,readonly" \
            --mount "type=bind,src=$secret_dir/cloud-mail,dst=/run/secrets/cloud-mail,readonly" \
            cloud-mail-relay:ci
          for attempt in $(seq 1 30); do
            if docker exec "$container" node -e \
              "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container" | grep -qx true; then
              docker logs "$container"
              exit 1
            fi
            sleep 2
          done
          docker logs "$container"
          exit 1
      - name: Validate Coolify remote-node Compose
        env:
          MAIL_HOSTNAME: mailout.example.com
          MAIL_PUBLIC_IPS: 8.8.8.8
          MAIL_DOMAINS: example.com
          ALLOWED_SENDER_DOMAINS: example.com
          LONGOS_RELAY_SHARED_SECRET: longos-longos-longos-longos-123456
          CLOUD_MAIL_RELAY_SHARED_SECRET: cloud-mail-cloud-mail-cloud-123456
          TUNNEL_TOKEN: validation-token-not-used-for-a-connection
        run: docker compose --file mail-relay/docker-compose.coolify.yml config --quiet
