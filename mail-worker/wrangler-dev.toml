name = "cloud-mail-dev"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[dev]
ip = "0.0.0.0"

[[d1_databases]]
binding = "db"
database_name = "cloud-mail-dev"
database_id = "00000000-0000-0000-0000-000000000000" #本地开发占位值；远程开发请替换

[[kv_namespaces]]
binding = "kv"
id = "00000000000000000000000000000000" #本地开发占位值；远程开发请替换

#[[r2_buckets]]
#binding = "r2"
#bucket_name = "email"

#[ai]
#binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

#[[send_email]]
#name = "email"


[vars]
ai_model = ""
analysis_cache = false
orm_log = true
domain = ["example.com", "example2.com", "example3.com", "example4.com"]
admin = "admin@example.com"
# Local secrets belong in .dev.vars (ignored by Git), never in this file:
# jwt_secret=<at-least-32-url-safe-random-characters>
# INIT_SECRET=<different-at-least-32-url-safe-random-characters>
