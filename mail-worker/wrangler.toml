name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

#[[d1_databases]]
#binding = "db"			#d1数据库绑定名默认不可修改
#database_name = ""		#d1数据库名字
#database_id = ""		#d1数据库id

#[[kv_namespaces]]
#binding = "kv"			#kv绑定名默认不可修改
#id = ""					#kv数据库id

#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = ""		#r2对象存储桶的名字

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *", "30 * * * *"] #整点维护；半点仅刷新分析缓存


[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct-fast
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
#domain = []				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
#admin = ""					#管理员的邮箱	示例: admin@example.com
#cors_origins = []			#可选：允许跨域调用 API 的浏览器来源（完整 https://origin）
#longos_relay_url = ""		#LONGOS 自建中继 HTTPS 地址；不用时留空
# jwt_secret 必须使用 `wrangler secret put jwt_secret` 写入，至少 32 位 URL-safe 随机字符。
# INIT_SECRET 是独立的数据库初始化密钥；GitHub Actions 会自动生成并轮换，本地部署需作为 Worker Secret 写入。
# 不要把 jwt_secret、Cloudflare API Token 或其他凭据写入 [vars] 或提交到 Git。
# RELAY_SHARED_SECRET must be stored with `wrangler secret put RELAY_SHARED_SECRET`.
# RESEND_WEBHOOK_SECRET must be stored with `wrangler secret put RESEND_WEBHOOK_SECRET`.
# Do not put relay or webhook secrets in this file or commit them to Git.

[build]
command = "pnpm --prefix ../mail-vue install --frozen-lockfile && pnpm --prefix ../mail-vue run build"
